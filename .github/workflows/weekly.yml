name: KCMO Weekly Digest

# 실행 트리거
on:
  schedule:
    # 토요일 23:00 UTC = 일요일 08:00 KST
    # CMW(일요일 23:00 UTC)와 하루 분산
    - cron: '0 23 * * 6'

  # 박사님이 GitHub 웹에서 수동으로 즉시 실행할 수 있는 버튼 활성화
  # 첫 발송 테스트나 임시 발송 시 사용
  workflow_dispatch:
    inputs:
      dry_run:
        description: '드라이런 모드 (실제 메일 발송 안 함, 미리보기만 생성)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 자동 commit을 위한 권한
permissions:
  contents: write

jobs:
  generate:
    name: Collect → Summarize → Build → Send
    runs-on: ubuntu-latest
    # 박사님 응급조치 (2026-05):
    # - 12 → 15분 (Tier 3X 광업 매체 + Google News 누적, summarize 처리시간 포함)
    # - threshold 10점 적용으로 카드 수 95 → 약 50개 감소
    # - 정상 실행은 11-13분. 15분 넘으면 강제 중단.
    # 리뉴얼 3d (2026-10-18): 15 → 25분. 코어 단계(주소 해석·본문 추출) 추가분.
    timeout-minutes: 25

    steps:
      # ----------------------------------------------------
      # 1. 저장소 체크아웃
      # ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 2. Python 환경 설정
      # ----------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ----------------------------------------------------
      # 3. 의존성 설치
      # ----------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests pyyaml anthropic beautifulsoup4 lxml
          # 리뉴얼 3d: 공통 코어(mincore v0.2.1) — 주소 해석·본문 추출·발행 원장·실행 보고
          pip install -r scripts/probe/requirements.txt

      # 산출물 파일명 날짜 (UTC, 파이프라인과 동일 규칙)
      - name: Set run date
        run: echo "D=$(date -u +%F)" >> "$GITHUB_ENV"

      # ----------------------------------------------------
      # 4. 수집 단계
      #    리뉴얼 3d (2026-10-25~): 코어 단계 + 발행 원장 제외.
      #    이전 회차 발행 기사(원매체 주소 일치 또는 제목 유사도 0.9 이상)는 raw에서 뺀다.
      #    코어 단계가 실패하면 ledger_hit 표시가 없어 아무것도 빠지지 않는다(기존 동작).
      # ----------------------------------------------------
      - name: Collect articles (7 countries, multilingual)
        env:
          KCMO_CORE_SHADOW: '1'
          KCMO_LEDGER_ENFORCE: '1'
          PYTHONIOENCODING: utf-8
        run: python scripts/collect.py

      # ----------------------------------------------------
      # 4b. 탄자니아 광물부 본문 페이지 수집 (1차 자료)
      #     madini.go.tz의 /page/{uuid}/ 본문 HTML을 직접 수집
      #     실패해도 다음 단계는 계속 진행
      # ----------------------------------------------------
      - name: Collect Tanzania ministry pages
        run: python scripts/madini_html_collector.py
        continue-on-error: true

      # ----------------------------------------------------
      # 5. 요약 단계 (Claude API)
      # ----------------------------------------------------
      - name: Summarize with Claude (ODA perspective)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/summarize.py

      # ----------------------------------------------------
      # 5b. 발행 원장 갱신 — 이번 회차 카드를 data/published_ledger.json에 추가
      #     (다음 회차부터 중복 제외). 드라이런 수동 실행은 원장에 넣지 않는다.
      #     아래 7단계 commit(git add data/)에 함께 실린다.
      # ----------------------------------------------------
      - name: Commit cards to published ledger
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python -m mincore.ledger commit --ledger data/published_ledger.json \
            --service kcmo --cards data/cards_$D.json
        continue-on-error: true

      # ----------------------------------------------------
      # 5c. 실행 보고 마무리 (요약 실패 수 추가) → data/reports/run_<날짜>.md
      #     원장 제외 목록도 이 보고서에 들어간다.
      # ----------------------------------------------------
      - name: Finalize run report
        run: |
          python -m mincore.report finalize --report data/reports/run_$D.json \
            --raw data/raw_$D.json --cards data/cards_$D.json
          cat data/reports/run_$D.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      # ----------------------------------------------------
      # 6. 사이트 빌드
      # ----------------------------------------------------
      - name: Build index.html
        env:
          MAILCHIMP_FORM_URL: ${{ secrets.MAILCHIMP_FORM_URL }}
        run: python scripts/build_index.py

      # ----------------------------------------------------
      # 7. 결과물 자동 commit (GitHub Pages 자동 갱신)
      # ----------------------------------------------------
      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if ! git diff --staged --quiet; then
            git commit -m "Weekly digest: $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit."
          fi

      # ----------------------------------------------------
      # 7b. CMW repo(critical-minerals) checkout — 박사님 옵시디언 vault
      #     vault/ 폴더가 박사님 평소 옵시디언 vault. KCMO는 vault/KCMO/ 서브폴더로 통합.
      #     실패해도 메일 발송은 계속 진행됨.
      # ----------------------------------------------------
      - name: Checkout Obsidian vault (CMW repo)
        uses: actions/checkout@v4
        with:
          repository: dolmudaddy/critical-minerals
          ref: main
          token: ${{ secrets.OBSIDIAN_VAULT_PAT }}
          path: vault-checkout
          fetch-depth: 0
        continue-on-error: true

      # ----------------------------------------------------
      # 7c. 카드 → 옵시디언 마크다운 생성
      #     박사님 vault 루트는 vault-checkout/vault/ (CMW repo 안의 vault 폴더)
      # ----------------------------------------------------
      - name: Generate Obsidian markdown
        run: python scripts/generate_obsidian.py --vault ./vault-checkout/vault
        continue-on-error: true

      # ----------------------------------------------------
      # 7d. CMW vault에 commit & push
      #     - vault/KCMO/ 폴더만 stage (박사님 KIGAM 노트와 분리)
      #     - 박사님 수동 commit과 충돌 방지: pull --rebase + 3회 재시도
      # ----------------------------------------------------
      - name: Commit and push to CMW vault
        working-directory: vault-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault/KCMO/
          if ! git diff --staged --quiet; then
            git commit -m "KCMO Weekly: $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "Push succeeded on attempt $i."
                break
              fi
              echo "Push attempt $i failed. Retrying in 5s..."
              sleep 5
            done
          else
            echo "No vault changes to commit."
          fi
        continue-on-error: true

      # ----------------------------------------------------
      # 8. Mailchimp 메일 발송
      #    이 단계가 실패해도 사이트는 이미 빌드/배포됨
      # ----------------------------------------------------
      - name: Send email via Mailchimp
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER: ${{ secrets.MAILCHIMP_SERVER }}
          MAILCHIMP_AUDIENCE_ID: ${{ secrets.MAILCHIMP_AUDIENCE_ID }}
          MAILCHIMP_REPLY_TO: ${{ secrets.MAILCHIMP_REPLY_TO }}
          MAILCHIMP_FROM_NAME: KCMO Weekly
          KCMO_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/send_email.py
        continue-on-error: true

      # ----------------------------------------------------
      # 9. 실행 결과 요약 (GitHub Actions 페이지에 표시)
      # ----------------------------------------------------
      - name: Print summary
        if: always()
        run: |
          echo "## KCMO Weekly Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run date:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run:** ${{ github.event.inputs.dry_run || 'false (scheduled)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/raw_$(date -u +'%Y-%m-%d').json" ]; then
            echo "- ✅ Raw collection: data/raw_$(date -u +'%Y-%m-%d').json" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "data/cards_$(date -u +'%Y-%m-%d').json" ]; then
            cards=$(python -c "import json; d=json.load(open('data/cards_$(date -u +'%Y-%m-%d').json')); print(d.get('total_cards', 0))")
            echo "- ✅ Cards generated: $cards" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "index.html" ]; then
            echo "- ✅ Site built: https://dolmudaddy.github.io/korea-oda-minerals/" >> $GITHUB_STEP_SUMMARY
          fi
