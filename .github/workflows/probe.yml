name: Body Probe (renewal)

# 리뉴얼 실측 전용 — 수동 실행만. 운영 weekly.yml과 무관.
# 결과는 commit하지 않고 artifact로만 업로드한다.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '서비스별 카드 수 제한 (0 = 전체, 스모크 테스트 시 5)'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CMW 카드 입력 (공개 repo, 읽기 전용)
      - name: Checkout CMW data
        uses: actions/checkout@v4
        with:
          repository: dolmudaddy/critical-minerals
          path: cmw-checkout
          sparse-checkout: data

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/probe/requirements.txt

      - name: Run probe
        env:
          PROBE_TAG: actions
          CMW_DATA_DIR: ${{ github.workspace }}/cmw-checkout/data
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/probe/body_probe.py --format kcmo --limit ${{ inputs.limit }}
          python scripts/probe/body_probe.py --format cmw --limit ${{ inputs.limit }}
          python scripts/probe/body_probe.py --report

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-probe-actions
          path: data/probe/*_actions.*
          if-no-files-found: warn
