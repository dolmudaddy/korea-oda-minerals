name: Body Probe (renewal)

# 리뉴얼 실측 전용 — 수동 실행만. 운영 weekly.yml과 무관.
# 결과는 commit하지 않고 artifact로만 업로드한다.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '서비스별 카드 수 제한 (0 = 전체, 스모크 테스트 시 5)'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 리뉴얼 ⑤ 브랜치 전용: 인도네시아 RSS 후보·Jina Reader 실측 (main의 probe.yml은 그대로)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests pyyaml beautifulsoup4 lxml
          pip install -r scripts/probe/requirements.txt

      - name: Run Indonesia probe
        env:
          PROBE_TAG: actions
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/probe/indonesia_probe.py --part AB --per-feed 8
          cat data/probe/indonesia_probe_*_actions.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indonesia-probe-actions
          path: data/probe/indonesia_probe_*_actions.*
          if-no-files-found: warn
